<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tickets | FIFA World Cup 26™</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #000; border-bottom: 2px solid #3262ec; padding: 0 40px; }
        .nav-container { max-width: 1300px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; height: 70px; }
        .brand { display: flex; align-items: center; gap: 15px; text-decoration: none; color: #fff; }
        .logo-badge { background: linear-gradient(135deg, #3262ec, #00d2ff); padding: 8px 14px; border-radius: 6px; font-weight: 900; }
        nav ul { display: flex; list-style: none; gap: 28px; }
        nav a { text-decoration: none; color: #e1e1e1; font-weight: 600; font-size: 14px; text-transform: uppercase; }
        nav a.active { color: #00d2ff; }

        .container { max-width: 700px; margin: 50px auto; padding: 0 20px; flex: 1; }
        .ticket-form { background: #161c28; border: 1px solid #222c3d; border-radius: 16px; padding: 40px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; color: #00d2ff; margin-bottom: 8px; text-transform: uppercase; }
        .form-group input { width: 100%; background: #0b0e14; border: 1px solid #222c3d; padding: 12px; border-radius: 8px; color: #fff; outline: none; }
        .btn-submit { width: 100%; background: #3262ec; color: #fff; border: none; padding: 14px; border-radius: 30px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        footer { background: #000; border-top: 1px solid #222c3d; padding: 30px 0; text-align: center; color: #64748b; font-size: 13px; }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="brand"><span class="logo-badge">FWC 26</span><strong>FIFA World Cup 26™</strong></a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="matches.html">Matches</a></li>
                    <li><a href="teams.html">Teams</a></li>
                    <li><a href="venues.html">Venues</a></li>
                    <li><a href="tickets.html" class="active">Tickets</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        <h1 style="font-size: 36px; text-align: center; margin-bottom: 10px;">TICKET REGISTRATION</h1>
        <p style="color: #94a3b8; text-align: center; margin-bottom: 30px;">Sign up for official ticketing updates and sales alerts.</p>

        <form class="ticket-form" onsubmit="event.preventDefault(); alert('Registration successful!');">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="john@example.com" required>
            </div>
            <button type="submit" class="btn-submit">Register Interest</button>
        </form>
    </div>

    <footer><p>&copy; 2026 FIFA World Cup 26™ Clone</p></footer>
</body>
</html>
